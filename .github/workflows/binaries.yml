name: Release binaries

# Builds the binaries of a release, attaches them to it, and updates the Homebrew formula.
on:
  # From release-plz.yml, once it has created a release: GitHub doesn't run workflows for releases
  # made with GITHUB_TOKEN, so this can't be triggered by the release itself.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  # To build the binaries of an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release, e.g. v0.2.0
        type: string
        required: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10

defaults:
  run:
    shell: bash

jobs:
  upload-assets:
    name: ${{ matrix.target }}
    if: github.repository_owner == 'abusch'
    runs-on: ${{ matrix.os }}
    strategy:
      # Attach whatever binaries can be built, rather than none.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
          - target: aarch64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-freebsd
            os: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
        if: contains(matrix.target, '-musl')
      - run: echo "RUSTFLAGS=${RUSTFLAGS} -C target-feature=+crt-static" >> "${GITHUB_ENV}"
        if: endsWith(matrix.target, 'windows-msvc')
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sinuous
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Point the formula of the Homebrew tap to the binaries just attached.
  homebrew:
    name: Homebrew formula
    needs: upload-assets
    if: github.repository_owner == 'abusch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          repository: abusch/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p tap/Formula
          .github/homebrew/formula.sh "$TAG" > tap/Formula/sinuous.rb
          cd tap
          git add Formula/sinuous.rb
          if git diff --cached --quiet; then
            echo "The formula is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sinuous ${TAG#v}"
          git push
