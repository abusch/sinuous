[package]
name = "sinuous"
version = "0.1.6"
edition = "2024"
description = "A simple TUI for controlling local Sonos speakers"
homepage = "https://github.com/abusch/sinuous"
repository = "https://github.com/abusch/sinuous.git"
license = "MIT"

[dependencies]
anyhow = "1.0.57"
clap = { version = "4.6", features = ["cargo"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11.0"
futures = "0.3.21"
human-panic = "2.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = "0.30.0"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = {
  version = "0.23.45",
  default-features = false,
  features = [
    "aws_lc_rs",
    "std",
  ]
}
serde = { version = "1.0.229", features = ["derive"] }
sinuous-client = "0.2.0"
tokio = { version = "1.18.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.34"
tracing-appender = "0.2.2"
tracing-subscriber = {
  version = "0.3.11",
  features = [
    "env-filter",
    "tracing-log",
  ]
}
tui-slider = "0.3.4"
url = "2"

[profile.release]
strip = "symbols"
