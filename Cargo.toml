[package]
name = "sinuous"
version = "0.2.0"
edition = "2024"
description = "A simple TUI for controlling local Sonos speakers"
homepage = "https://github.com/abusch/sinuous"
repository = "https://github.com/abusch/sinuous.git"
license = "MIT"
keywords = ["music", "sonos", "speakers", "terminal", "tui"]
categories = ["command-line-utilities"]
exclude = [".github/", "assets/", "release-plz.toml"]

[dependencies]
anyhow = "1.0.57"
clap = { version = "4.6", features = ["cargo"] }
crossterm = { version = "0.29", features = ["event-stream"] }
etcetera = "0.11.0"
futures = "0.3.21"
human-panic = "2.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
opaline = { version = "0.4.2", default-features = false, features = ["builtin-themes", "ratatui"] }
ratatui = "0.30.0"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
sinuous-client = { version = "0.4.0", features = ["upnp"] }
tokio = { version = "1.18.2", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.34"
tracing-appender = "0.2.2"
tracing-subscriber = { version = "0.3.11", features = ["env-filter", "tracing-log"] }
url = "2"

[profile.release]
strip = "symbols"

[dev-dependencies]
serde_json = "1.0.154"
